<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title><{:C("WEB_TITLE")}></title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
    <link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
    <link href="/Public/Front/css/animate.css" rel="stylesheet">
    <link href="/Public/Front/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>商户策略分配</h5>
                </div>
                <div class="ibox-content">
                    <form class="layui-form" action="<{:U('assignMember')}>" method="post" id="form-assign">
                        <input type="hidden" name="userid" value="<{$member.id}>" />
                        <input type="hidden" name="type" value="<{$type}>" />

                        <div class="layui-form-item">
                            <label class="layui-form-label">商户ID：</label>
                            <div class="layui-input-block">
                                <span class="layui-form-text" style="line-height: 38px;"><{$member.id + 10000}></span>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label">商户名称：</label>
                            <div class="layui-input-block">
                                <span class="layui-form-text" style="line-height: 38px;"><{$member.username}></span>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label">策略类型：</label>
                            <div class="layui-input-block">
                                <span class="label label-primary"><{$typename}></span>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="c-red">*</span>选择策略：</label>
                            <div class="layui-input-block">
                                <select name="strategyid" class="layui-input" style="width: 300px;">
                                    <option value="0">-- 不使用策略（原逻辑）--</option>
                                    <volist name="strategys" id="s">
                                        <option value="<{$s.id}>" <if condition="isset($current) and $current['strategyid'] eq $s['id']">selected</if>><{$s.name}></option>
                                    </volist>
                                </select>
                            </div>
                        </div>

                        <if condition="isset($current) and !empty($current['strategy_info'])">
                        <div class="layui-form-item">
                            <label class="layui-form-label">当前策略：</label>
                            <div class="layui-input-block">
                                <span class="label label-success"><{$current.strategy_info.name}></span>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label">档位预览：</label>
                            <div class="layui-input-block">
                                <table class="table table-bordered">
                                    <thead>
                                        <tr>
                                            <th>档位名称</th>
                                            <th>金额范围</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <volist name="current.tiers" id="tier">
                                        <tr>
                                            <td><{$tier.tier_name}></td>
                                            <td><{$tier.tier_min}> - <{$tier.tier_max}></td>
                                        </tr>
                                        </volist>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        </if>

                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" lay-submit lay-filter="*" type="submit">保存</button>
                                <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.close(parent.layer.getFrameIndex(window.name))">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/Public/Front/js/jquery.min.js"></script>
<script src="/Public/Front/js/bootstrap.min.js"></script>
<script src="/Public/Front/js/content.js"></script>
<script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
<script>
layui.use(['layer', 'form'], function(){
    var form = layui.form, layer = layui.layer;

    form.on('submit(*)', function(data){
        $.ajax({
            type: 'POST',
            url: $(data.form).attr('action'),
            data: $(data.form).serialize(),
            dataType: 'json',
            success: function(res){
                if(res.status == 1){
                    layer.msg(res.msg, {icon:1, time:1500});
                    setTimeout(function(){
                        parent.location.reload();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    }, 1500);
                } else {
                    layer.msg(res.msg, {icon:2, time:2000});
                }
            }
        });
        return false;
    });
});
</script>
</body>
</html>
