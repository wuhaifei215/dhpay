<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<title><{:C("WEB_TITLE")}></title>
<link rel="shortcut icon" href="favicon.ico">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
<link href="/Public/Front/css/animate.css" rel="stylesheet">
<link href="/Public/Front/css/style.css" rel="stylesheet">
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css"  media="all">
<style>
.merchant-summary {margin-bottom:16px;padding:10px 14px;background:#f7f8fa;border:1px solid #e7eaec;}
.product-strategy-row {display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #e7eaec;}
.product-choice {width:230px;margin:0;padding-left:20px;}
.product-choice small {display:block;margin-left:20px;color:#888;}
.strategy-choice {flex:1;min-width:0;}
.product-check {margin-top: 0 !important;}
</style>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content animated">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>为商户【<{$member.username}>】分配<{$typename}>策略</h5>
                    </div>
                    <div class="ibox-content">
                        <form class="form-horizontal" method="post" action="<{:U('assignMember')}>" id="assignForm">
                            <input type="hidden" name="userid" value="<{$member.id}>">
                            <input type="hidden" name="type" value="<{$type}>">

                            <div class="merchant-summary">
                                商户编号：<strong><{$member.id|shanghubianhao=###}></strong><br/>
                                用户名：<strong><{$member.username}></strong><br/>
                                国家：<strong><{$member.currency}></strong>
                            </div>

                            <h4>产品策略配置</h4>
                            <p class="text-muted">可同时配置多个已开通产品；选择产品后，只能选择该产品对应的<{$typename}>策略。</p>

                            <div class="product-strategy-list">
                                <volist name="products" id="p">
                                    <div class="product-strategy-row" data-productid="<{$p.id}>">
                                        <label class="checkbox product-choice">
                                            <input type="checkbox" class="product-check" name="productids[]" value="<{$p.id}>" <if condition="$p['current'] AND !empty($p['strategies'])">checked</if> <if condition="empty($p['strategies'])">disabled</if>>
                                            <span><{$p.id}>--<{$p.name}></span>
                                        </label>
                                        <div class="strategy-choice">
                                            <select name="strategyids[<{$p.id}>]" class="form-control strategy-select" <if condition="!$p['current'] OR empty($p['strategies'])">disabled</if>>
                                                <option value="">-- 请选择<{$p.name}>的策略 --</option>
                                                <volist name="p['strategies']" id="s">
                                                    <option value="<{$s.id}>" <if condition="$p['current'] AND $p['current']['strategyid'] eq $s['id']">selected</if>><{$s.name}></option>
                                                </volist>
                                            </select>
                                            <if condition="empty($p['strategies'])">
                                                <span class="help-block text-warning">当前产品暂无可用策略</span>
                                            </if>
                                        </div>
                                    </div>
                                </volist>
                                <if condition="empty($products)">
                                    <div class="alert alert-warning">该商户暂无已开通的<{$typename}>产品</div>
                                </if>
                            </div>

                            <div class="form-group">
                                <div class="col-sm-12" style="margin-top:20px;">
                                    <button type="submit" class="layui-btn">保存</button>
                                    <button type="button" class="layui-btn layui-btn-primary" onclick="closeLayer()">取消</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/Public/Front/js/jquery.min.js"></script>
    <script src="/Public/Front/js/bootstrap.min.js"></script>
    <script src="/Public/Front/js/content.js"></script>
    <script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
    <script>
    layui.use(['layer', 'form'], function(){
        var form = layui.form,
        layer = layui.layer;

        $('.product-check').on('change', function(){
            var $row = $(this).closest('.product-strategy-row');
            var $select = $row.find('.strategy-select');
            $select.prop('disabled', !this.checked);
            if (!this.checked) {
                $select.val('');
            }
        });

        // 表单提交
        $('#assignForm').on('submit', function(){
            var valid = true;
            $('.product-check:checked').each(function(){
                var $row = $(this).closest('.product-strategy-row');
                if (!$row.find('.strategy-select').val()) {
                    layer.msg('请选择“' + $row.find('.product-choice strong').text() + '”对应的策略', {icon: 2});
                    valid = false;
                    return false;
                }
            });
            if (!valid) {
                return false;
            }
            $.ajax({
                url: "<{:U('assignMember')}>",
                type: 'post',
                data: $(this).serialize(),
                success: function(res){
                    if (res.status == 1) {
                        layer.msg('保存成功', {icon: 1});
                        setTimeout(function(){
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.layer.close(index);
                            parent.location.reload();
                        }, 1000);
                    } else {
                        layer.msg(res.msg || '保存失败', {icon: 2});
                    }
                }
            });
            return false;
        });
    });

    function closeLayer() {
        var index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
    }
    </script>
</body>
</html>
