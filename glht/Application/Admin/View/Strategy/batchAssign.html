<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <title><{:C("WEB_TITLE")}></title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
    <link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
    <link href="/Public/Front/css/animate.css" rel="stylesheet">
    <link href="/Public/Front/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>批量分配策略 - <if condition="$type eq 1">代收<else/>代付</if></h5>
                </div>
                <div class="ibox-content">
                    <form class="layui-form" action="<{:U('saveBatchAssign')}>" method="post" id="form-batch">
                        <input type="hidden" name="type" value="<{$type}>" />

                        <div class="layui-form-item">
                            <label class="layui-form-label">策略类型：</label>
                            <div class="layui-input-block">
                                <span class="label label-primary"><if condition="$type eq 1">代收<else/>代付</if></span>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="c-red">*</span>选择商户：</label>
                            <div class="layui-input-block">
                                <select name="ids" id="ids" class="layui-input" multiple style="width: 400px; height: 200px;">
                                    <volist name="userList" id="u">
                                        <option value="<{$u.id}>"><{$u.username}> (ID:<{$u.id + 10000}>)</option>
                                    </volist>
                                </select>
                                <div class="layui-form-mid layui-word-aux">按住 Ctrl 可多选</div>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="c-red">*</span>选择策略：</label>
                            <div class="layui-input-block">
                                <select name="strategyid" class="layui-input" style="width: 300px;">
                                    <option value="0">-- 清除策略（原逻辑）--</option>
                                    <volist name="strategies" id="s">
                                        <option value="<{$s.id}>"><{$s.name}></option>
                                    </volist>
                                </select>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" lay-submit lay-filter="*" type="submit">确认分配</button>
                                <button type="button" class="layui-btn layui-btn-primary" onclick="parent.layer.close(parent.layer.getFrameIndex(window.name))">取消</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/Public/Front/js/jquery.min.js"></script>
<script src="/Public/Front/js/bootstrap.min.js"></script>
<script src="/Public/Front/js/content.js"></script>
<script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
<script>
layui.use(['layer', 'form'], function(){
    var form = layui.form, layer = layui.layer;

    form.on('submit(*)', function(data){
        var selectedOptions = $('#ids option:selected');
        if (selectedOptions.length === 0) {
            layer.msg('请选择商户', {icon: 2, time: 2000});
            return false;
        }

        var ids = [];
        selectedOptions.each(function(){
            ids.push($(this).val());
        });

        $.ajax({
            type: 'POST',
            url: $(data.form).attr('action'),
            data: $(data.form).serialize() + '&ids=' + ids.join(','),
            dataType: 'json',
            success: function(res){
                if(res.status == 1){
                    layer.msg(res.msg, {icon:1, time:2000});
                    setTimeout(function(){
                        parent.location.reload();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    }, 2000);
                } else {
                    layer.msg(res.msg, {icon:2, time:2000});
                }
            }
        });
        return false;
    });
});
</script>
</body>
</html>
