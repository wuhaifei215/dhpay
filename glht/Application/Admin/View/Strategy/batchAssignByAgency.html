<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<title><{:C("WEB_TITLE")}></title>
<link rel="shortcut icon" href="favicon.ico">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
<link href="/Public/Front/css/animate.css" rel="stylesheet">
<link href="/Public/Front/css/style.css" rel="stylesheet">
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css" media="all">
<style>
.layui-form-switch {width:54px;padding:0;}
.layui-form-label {width:100px;padding:4px}
.batch-settings {display:flex;align-items:center;gap:24px;padding:12px 16px;border:1px solid #e5e6e7;background:#fafafa;}
.product-list {margin-top:12px;border:1px solid #e5e6e7;padding:0 16px;}
.product-row {display:flex;align-items:center;gap:16px;min-height:58px;border-bottom:1px solid #e5e6e7;}
.product-row:last-child {border-bottom:0;}
.product-check {width:270px;padding-left:20px;}
.product-select {flex:1;min-width:260px;}
.product-empty {color:#999;line-height:38px;}
</style>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content animated">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>用户多产品策略配置 - 按包网</h5>
                    </div>
                    <div class="ibox-content">
                        <!-- Tab + 国家筛选 -->
                        <div class="row" style="margin-bottom:15px;">
                            <div class="col-sm-12">
                                <div class="layui-tab" style="margin-bottom:0;">
                                    <ul class="layui-tab-title">
                                        <li><a href="<{:U('Strategy/batchAssign', 'type='.$type.'&currency='.$currency)}>">按商户</a></li>
                                        <li class="layui-this">按包网</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <form method="get" action="" class="form-inline" style="margin-bottom:15px;">
                            <input type="hidden" name="type" value="<{$type}>">
                            <div class="form-group">
                                <label>国家：</label>
                                <select name="currency" class="form-control" onchange="this.form.submit()">
                                    <option value="">全部</option>
                                    <volist name="country" id="c">
                                    <option value="<{$c.currency}>" <if condition="$currency eq $c['currency']">selected</if>><{$c.title}> (<{$c.currency}>)</option>
                                    </volist>
                                </select>
                            </div>
                        </form>

                        <!-- 策略配置 -->
                        <form class="layui-form" id="batchAssignForm">
                            <input type="hidden" name="currency" value="<{$currency}>">
                            <div class="batch-settings">
                                <div class="layui-inline">
                                    <label class="layui-form-label" style="width:80px;">策略类型</label>
                                    <div class="layui-input-inline" style="width:150px;">
                                        <select name="type" lay-filter="typeFilter" id="typeSelect">
                                            <option value="1" <if condition="$type eq 1">selected</if>>代收</option>
                                            <option value="2" <if condition="$type eq 2">selected</if>>代付</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label" style="width:60px;">状态</label>
                                    <div class="layui-input-inline" style="width:100px;">
                                        <select name="status">
                                            <option value="1">启用</option>
                                            <option value="0">禁用</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="product-list">
                                <volist name="products" id="p">
                                    <div class="product-row" data-productid="<{$p.id}>">
                                        <div class="product-check">
                                            <input type="checkbox" name="productids[]" value="<{$p.id}>" title="<{$p.id}>--<{$p.name}> (<{$p.currency}>)" class="product-checkbox" lay-skin="primary" lay-filter="productCheck">
                                        </div>
                                        <div class="product-select">
                                            <select name="strategyids[<{$p.id}>]" class="strategy-select" disabled>
                                                <option value="">-- 请选择<{$p.name}>的策略或操作 --</option>
                                                <option value="0">-- 清除该产品策略 --</option>
                                                <volist name="p['strategies']" id="s">
                                                    <option value="<{$s.id}>"><{$s.name}></option>
                                                </volist>
                                            </select>
                                        </div>
                                    </div>
                                </volist>
                                <if condition="empty($products)">
                                    <div class="product-empty">当前条件下暂无可配置产品</div>
                                </if>
                            </div>

                            <!-- 包网列表 -->
                            <div class="row" style="margin-top:20px;">
                                <div class="col-sm-12">
                                    <div class="alert alert-info" style="margin-bottom:10px;padding:8px 15px;">
                                        已选国家：<strong><if condition="$currency neq ''"><{$currency}><else/>全部</if></strong>
                                        &nbsp;|&nbsp; 包网数量：<strong><{:count($agency)}></strong>
                                        &nbsp;|&nbsp; <a href="javascript:;" id="checkAll">全选</a> / <a href="javascript:;" id="checkReverse">反选</a>
                                    </div>
                                </div>
                            </div>
                            <div style="max-height:400px;overflow-y:auto;border:1px solid #e5e6e7;padding:10px;border-radius:4px;">
                                <volist name="agency" id="vo" key="k">
                                <div style="display:inline-block;width:220px;padding:4px 6px;">
                                    <input type="checkbox" title="<{$vo.username}>" value="<{$vo.id}>" class='checkIds' lay-skin="primary">
                                </div>
                                </volist>
                                <if condition="empty($agency)">
                                    <div class="text-center text-muted" style="padding:30px;">该条件下没有可分配的包网</div>
                                </if>
                            </div>

                            <div class="layui-form-item" style="margin-top:20px;">
                                <div class="layui-input-block">
                                    <button class="layui-btn layui-btn-lg" lay-submit lay-filter="save">提交保存</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/Public/Front/js/jquery.min.js"></script>
    <script src="/Public/Front/js/bootstrap.min.js"></script>
    <script src="/Public/Front/js/content.js"></script>
    <script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
    <script>
    layui.use(['layer', 'form'], function(){
        var form = layui.form
        ,layer = layui.layer;

        form.on('select(typeFilter)', function(data){
            location.href = "<{:U('batchAssignByAgency')}>?type=" + data.value + "&currency=<{$currency}>";
        });
        form.on('checkbox(productCheck)', function(data){
            var $row = $(data.elem).closest('.product-row');
            var $select = $row.find('.strategy-select');
            $select.prop('disabled', !data.elem.checked);
            if (!data.elem.checked) {
                $select.val('');
            }
            form.render('select');
        });

        form.on('submit(save)', function(data){
            var ids = '';
            $('.checkIds').each(function () {
                if ($(this).is(':checked')) {
                    ids += $(this).val() + ',';
                }
            });

            if (ids == '') {
                layer.msg('请选择包网', {icon: 2, time: 2000});
                return false;
            }

            var productValid = true;
            $('.product-checkbox:checked').each(function(){
                var $row = $(this).closest('.product-row');
                if ($row.find('.strategy-select').val() === '') {
                    layer.msg('请为“' + $(this).attr('title') + '”选择策略或清除操作', {icon: 2, time: 2000});
                    productValid = false;
                    return false;
                }
            });
            if (!$('.product-checkbox:checked').length) {
                layer.msg('请至少选择一个产品', {icon: 2, time: 2000});
                return false;
            }
            if (!productValid) {
                return false;
            }

            $.ajax({
                url: "<{:U('saveBatchAssignByAgency')}>",
                type: "post",
                data: $('#batchAssignForm').serialize() + '&ids=' + encodeURIComponent(ids),
                success: function(res){
                    if (res.status) {
                        layer.alert(res.info || "操作成功", {icon: 6}, function () {
                            parent.location.reload();
                        });
                    } else {
                        layer.alert(res.info || "操作失败", {icon: 5});
                    }
                }
            });
            return false;
        });
    });

    $('#checkAll').on('click', function(){
        $('.checkIds').prop('checked', true);
        layui.form.render('checkbox');
    });

    $('#checkReverse').on('click', function(){
        $('.checkIds').each(function(){
            $(this).prop('checked', !$(this).prop('checked'));
        });
        layui.form.render('checkbox');
    });
    </script>
</body>
</html>
