<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<title><{:C("WEB_TITLE")}></title>
<link rel="shortcut icon" href="favicon.ico">
<link href="/Public/Front/css/bootstrap.min.css" rel="stylesheet">
<link href="/Public/Front/css/font-awesome.min.css" rel="stylesheet">
<link href="/Public/Front/css/animate.css" rel="stylesheet">
<link href="/Public/Front/css/style.css" rel="stylesheet">
<link rel="stylesheet" href="/Public/Front/js/plugins/layui/css/layui.css" media="all">
<style>
.layui-form-switch {width:54px;padding:0;}
.layui-form-label {width:100px;padding:4px}
</style>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content animated">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>批量分配策略 - 按国家</h5>
                    </div>
                    <div class="ibox-content">
                        <!-- Tab -->
                        <div class="row" style="margin-bottom:15px;">
                            <div class="col-sm-12">
                                <div class="layui-tab" style="margin-bottom:0;">
                                    <ul class="layui-tab-title">
                                        <li><a href="<{:U('Strategy/batchAssign')}>">按商户</a></li>
                                        <li><a href="<{:U('Strategy/batchAssignByAgency')}>">按包网</a></li>
                                        <li class="layui-this">按国家</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- 策略配置 -->
                        <form class="layui-form" id="batchAssignForm">
                            <div class="layui-form-item" style="border:1px solid #e5e6e7;padding:15px;border-radius:4px;background:#fafafa;">
                                <div class="layui-inline" style="margin-right:30px;">
                                    <label class="layui-form-label" style="width:80px;">策略类型</label>
                                    <div class="layui-input-inline" style="width:150px;">
                                        <select name="type" lay-filter="typeFilter" id="typeSelect">
                                            <option value="1" <if condition="$type eq 1">selected</if>>代收</option>
                                            <option value="2" <if condition="$type eq 2">selected</if>>代付</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline" style="margin-right:30px;">
                                    <label class="layui-form-label" style="width:80px;">选择策略</label>
                                    <div class="layui-input-inline" style="width:250px;">
                                        <select name="strategyid" id="strategySelect" lay-filter="strategyFilter">
                                            <option value="0">-- 不启用策略（清除） --</option>
                                            <volist name="strategies" id="s">
                                            <option value="<{$s.id}>" data-currency="<{$s.currency}>"><{$s.name}> (<{$s.currency}>)</option>
                                            </volist>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline" style="margin-right:30px;">
                                    <label class="layui-form-label" style="width:80px;">选择国家</label>
                                    <div class="layui-input-inline" style="width:200px;">
                                        <select name="currency" id="currencySelect">
                                            <option value="">-- 请选择国家 --</option>
                                            <volist name="country" id="c">
                                                <option value="<{$c.currency}>" <if condition="$currency eq $c['currency']">selected</if>><{$c.title}> (<{$c.currency}>)</option>
                                            </volist>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label" style="width:60px;">状态</label>
                                    <div class="layui-input-inline" style="width:100px;">
                                        <select name="status">
                                            <option value="1">启用</option>
                                            <option value="0">禁用</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item" style="margin-top:20px;">
                                <div class="layui-input-block">
                                    <button class="layui-btn layui-btn-lg" lay-submit lay-filter="save">提交保存</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/Public/Front/js/jquery.min.js"></script>
    <script src="/Public/Front/js/bootstrap.min.js"></script>
    <script src="/Public/Front/js/content.js"></script>
    <script src="/Public/Front/js/plugins/layui/layui.js" charset="utf-8"></script>
    <script>
    var allCountries = <php>echo json_encode($countryList);</php>;

    layui.use(['layer', 'form'], function(){
        var form = layui.form
        ,layer = layui.layer;

        form.on('select(typeFilter)', function(data){
            location.href = "<{:U('batchAssignByCurrency')}>?type=" + data.value;
        });

        // 策略切换时过滤国家
        form.on('select(strategyFilter)', function(data){
            var selected = $('#strategySelect option:selected');
            var currency = selected.attr('data-currency');
            var opts = '<option value="">-- 不限制国家 --</option>';
            if (currency && currency != '') {
                $.each(allCountries, function(i, c){
                    if (c.currency === currency) {
                        opts += '<option value="'+c.currency+'" selected>'+c.title+' ('+c.currency+')</option>';
                    }
                });
            } else {
                $.each(allCountries, function(i, c){
                    opts += '<option value="'+c.currency+'">'+c.title+' ('+c.currency+')</option>';
                });
            }
            $('#currencySelect').html(opts);
            form.render('select');
        });

        form.on('submit(save)', function(data){
            var currency = data.field.currency;
            if (currency == '') {
                layer.msg('请选择国家', {icon: 2, time: 2000});
                return false;
            }

            $.ajax({
                url: "<{:U('saveBatchAssignByCurrency')}>",
                type: "post",
                data: {
                    'currency': currency,
                    'type': data.field.type,
                    'strategyid': data.field.strategyid,
                    'status': data.field.status
                },
                success: function(res){
                    if (res.status) {
                        layer.alert("操作成功", {icon: 6}, function () {
                            parent.location.reload();
                        });
                    } else {
                        layer.alert(res.info || res.msg || "操作失败", {icon: 5});
                    }
                }
            });
            return false;
        });
    });
    </script>
</body>
</html>
