<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑策略</title>
    <include file="Public:static" />
    <include file="Public:header" />
    <style>
        .form-label { width: 100px; }
        .form-text { width: 300px; }
    </style>
</head>
<body>
<div class="page-container">
    <form action="{:U('edit')}" method="post" class="form form-horizontal" id="form-strategy-edit">
        <input type="hidden" name="id" value="{$info.id|default=''}" />
        <input type="hidden" name="type" value="{$type}" />

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3"><span class="c-red">*</span>策略名称：</label>
            <div class="formControls col-xs-8 col-sm-6">
                <input type="text" class="input-text" value="{$info.name|default=''}" placeholder="请输入策略名称" id="name" name="name" style="width: 300px;">
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3">策略类型：</label>
            <div class="formControls col-xs-8 col-sm-6">
                <span class="label label-primary">{$typename}</span>
                <input type="hidden" name="type" value="{$type}" />
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3">状态：</label>
            <div class="formControls col-xs-8 col-sm-6 skin-minimal">
                <div class="radio-box">
                    <input type="radio" name="status" id="status-1" value="1" <if condition="!isset($info) or $info['status'] eq 1">checked</if>>
                    <label for="status-1">启用</label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="status" id="status-0" value="0" <if condition="isset($info) and $info['status'] eq 0">checked</if>>
                    <label for="status-0">禁用</label>
                </div>
            </div>
        </div>

        <div class="row cl">
            <div class="col-xs-8 col-sm-9 col-xs-offset-4 col-sm-offset-3">
                <button type="submit" class="btn btn-primary radius">保存</button>
                <button type="button" class="btn btn-default radius" onclick="layer_close()">取消</button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript">
$(function(){
    $('.skin-minimal input').iCheck({
        radioClass: 'iradio-blue',
        increaseArea: '20%'
    });

    $("#form-strategy-edit").validate({
        rules: {
            name: {
                required: true,
                minlength: 2,
                maxlength: 100
            }
        },
        messages: {
            name: {
                required: "策略名称不能为空",
                minlength: "至少2个字符",
                maxlength: "最多100个字符"
            }
        },
        submitHandler: function(form) {
            $.ajax({
                type: 'POST',
                url: $(form).attr('action'),
                data: $(form).serialize(),
                dataType: 'json',
                success: function(data) {
                    if (data.status == 1) {
                        layer.msg(data.msg, {icon: 1, time: 1500});
                        setTimeout(function() {
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.location.reload();
                            parent.layer.close(index);
                        }, 1500);
                    } else {
                        layer.msg(data.msg, {icon: 2, time: 2000});
                    }
                }
            });
            return false;
        }
    });
});
</script>
</body>
</html>
