<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑档位</title>
    <include file="Public:static" />
    <include file="Public:header" />
    <style>
        .form-label { width: 110px; }
        .form-text { width: 200px; }
        .channel-item { margin-bottom: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; }
        .channel-item select { width: 200px; }
        .channel-item input { width: 80px; }
    </style>
</head>
<body>
<div class="page-container">
    <form action="{:U('editTier')}" method="post" class="form form-horizontal" id="form-tier-edit">
        <input type="hidden" name="id" value="{$info.id|default=''}" />
        <input type="hidden" name="strategyid" value="{$strategy.id}" />

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3"><span class="c-red">*</span>档位名称：</label>
            <div class="formControls col-xs-8 col-sm-6">
                <input type="text" class="input-text" value="{$info.tier_name|default=''}" placeholder="如：小额档、中额档、大额档" id="tier_name" name="tier_name">
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3"><span class="c-red">*</span>金额范围：</label>
            <div class="formControls col-xs-8 col-sm-6">
                <input type="number" class="input-text" style="width: 100px;" value="{$info.tier_min|default='0'}" placeholder="最小金额" id="tier_min" name="tier_min"> -
                <input type="number" class="input-text" style="width: 100px;" value="{$info.tier_max|default='0'}" placeholder="最大金额" id="tier_max" name="tier_max">
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3">排序：</label>
            <div class="formControls col-xs-8 col-sm-6">
                <input type="number" class="input-text" value="{$info.sort|default='100'}" placeholder="数字越小越优先" id="sort" name="sort" style="width: 100px;">
                <span class="c-gray">（数字越小排序越靠前）</span>
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3">状态：</label>
            <div class="formControls col-xs-8 col-sm-6 skin-minimal">
                <div class="radio-box">
                    <input type="radio" name="status" id="status-1" value="1" <if condition="!isset($info) or $info['status'] eq 1">checked</if>>
                    <label for="status-1">启用</label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="status" id="status-0" value="0" <if condition="isset($info) and $info['status'] eq 0">checked</if>>
                    <label for="status-0">禁用</label>
                </div>
            </div>
        </div>

        <div class="row cl">
            <label class="form-label col-xs-4 col-sm-3"><span class="c-red">*</span>通道配置：</label>
            <div class="formControls col-xs-8 col-sm-8">
                <div id="channel-list">
                    <notpresent name="info.channel_config_arr">
                        <div class="channel-item">
                            <select name="channel_select[]" class="input-text" style="width: 200px;">
                                <option value="">请选择通道</option>
                                <volist name="channels" id="ch">
                                    <option value="{$ch.id}">{$ch.title}<if condition="isset($ch.rate)"> ({$ch.rate}%)</if></option>
                                </volist>
                            </select>
                            权重：<input type="number" class="input-text" name="weight[]" value="10" min="1" style="width: 60px;">
                            <a href="javascript:void(0)" onclick="addChannel()">+ 添加</a>
                            <a href="javascript:void(0)" onclick="removeChannel(this)">- 删除</a>
                        </div>
                    <else/>
                        <volist name="info.channel_config_arr" id="ch">
                            <div class="channel-item">
                                <select name="channel_select[]" class="input-text" style="width: 200px;">
                                    <option value="">请选择通道</option>
                                    <volist name="channels" key="ck" id="c">
                                        <option value="{$c.id}" <if condition="$ch['channel_id'] eq $c['id']">selected</if>>{$c.title}<if condition="isset($c.rate)"> ({$c.rate}%)</if></option>
                                    </volist>
                                </select>
                                权重：<input type="number" class="input-text" name="weight[]" value="{$ch.weight}" min="1" style="width: 60px;">
                                <a href="javascript:void(0)" onclick="addChannel()">+ 添加</a>
                                <a href="javascript:void(0)" onclick="removeChannel(this)">- 删除</a>
                            </div>
                        </volist>
                    </notpresent>
                </div>
                <span class="c-gray">（可添加多个通道，权重表示分配比例）</span>
            </div>
        </div>

        <input type="hidden" name="channel_ids" id="channel_ids" value="" />
        <input type="hidden" name="weights" id="weights" value="" />

        <div class="row cl">
            <div class="col-xs-8 col-sm-9 col-xs-offset-4 col-sm-offset-3">
                <button type="submit" class="btn btn-primary radius">保存</button>
                <button type="button" class="btn btn-default radius" onclick="layer_close()">取消</button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript">
// 添加通道
function addChannel() {
    var html = '<div class="channel-item">' +
        '<select name="channel_select[]" class="input-text" style="width: 200px;">' +
        '<option value="">请选择通道</option>' +
        <volist name="channels" id="ch">' +
        '<option value="{$ch.id}">{$ch.title}<if condition="isset($ch.rate)"> ({$ch.rate}%)</if></option>' +
        </volist>
        '</select>' +
        '权重：<input type="number" class="input-text" name="weight[]" value="10" min="1" style="width: 60px;">' +
        '<a href="javascript:void(0)" onclick="addChannel()">+ 添加</a>' +
        '<a href="javascript:void(0)" onclick="removeChannel(this)">- 删除</a>' +
        '</div>';
    $('#channel-list').append(html);
}

// 删除通道
function removeChannel(obj) {
    var items = $('#channel-list .channel-item');
    if (items.length > 1) {
        $(obj).parent().remove();
    } else {
        layer.msg('至少保留一个通道配置', {icon: 0, time: 1500});
    }
}

$(function(){
    $('.skin-minimal input').iCheck({
        radioClass: 'iradio-blue',
        increaseArea: '20%'
    });

    $("#form-tier-edit").validate({
        rules: {
            tier_name: {
                required: true,
                maxlength: 50
            },
            tier_min: {
                required: true,
                number: true,
                min: 0
            },
            tier_max: {
                required: true,
                number: true,
                min: 0
            }
        },
        messages: {
            tier_name: {
                required: "档位名称不能为空"
            },
            tier_min: {
                required: "最小金额不能为空",
                number: "请输入有效数字",
                min: "金额不能为负数"
            },
            tier_max: {
                required: "最大金额不能为空",
                number: "请输入有效数字",
                min: "金额不能为负数"
            }
        },
        submitHandler: function(form) {
            // 收集通道配置
            var channelIds = [];
            var weights = [];
            $('#channel-list .channel-item').each(function() {
                var channelId = $(this).find('select').val();
                var weight = $(this).find('input[name="weight[]"]').val();
                if (channelId) {
                    channelIds.push(channelId);
                    weights.push(weight);
                }
            });

            if (channelIds.length === 0) {
                layer.msg('请至少选择一个通道', {icon: 2, time: 2000});
                return false;
            }

            $('#channel_ids').val(channelIds.join(','));
            $('#weights').val(weights.join(','));

            $.ajax({
                type: 'POST',
                url: $(form).attr('action'),
                data: $(form).serialize(),
                dataType: 'json',
                success: function(data) {
                    if (data.status == 1) {
                        layer.msg(data.msg, {icon: 1, time: 1500});
                        setTimeout(function() {
                            var index = parent.layer.getFrameIndex(window.name);
                            parent.location.reload();
                            parent.layer.close(index);
                        }, 1500);
                    } else {
                        layer.msg(data.msg, {icon: 2, time: 2000});
                    }
                }
            });
            return false;
        }
    });
});
</script>
</body>
</html>
