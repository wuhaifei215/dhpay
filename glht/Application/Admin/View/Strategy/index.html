<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>策略列表</title>
    <include file="Public:static" />
    <include file="Public:header" />
</head>
<body>
<div class="page-container">
    <div class="text-l">
        <form method="get" action="{:U('index')}">
            <input type="hidden" name="type" value="{$type}" />
            状态：
            <select name="status" class="input-text" style="width: 100px;">
                <option value="">全部</option>
                <option value="1" <if condition="$status eq '1'">selected</if>>启用</option>
                <option value="0" <if condition="$status eq '0'">selected</if>>禁用</option>
            </select>
            <button type="submit" class="btn btn-success" id="btnSearch"><i class="Hui-iconfont">&#xe665;</i> 搜索</button>
        </form>
    </div>

    <div class="cl pd-5 bg-1 bk-gray mt-20">
        <span class="l">
            <a class="btn btn-primary radius" href="javascript:;" onclick="strategy_edit('添加策略', '{:U(\'edit\', array(\'type\' => $type))}')">
                <i class="Hui-iconfont">&#xe600;</i> 添加策略
            </a>
            <a href="{:U('index', array('type' => 1))}" class="btn btn-secondary radius <if condition="$type eq 1">disabled</if>">代收策略</a>
            <a href="{:U('index', array('type' => 2))}" class="btn btn-secondary radius <if condition="$type eq 2">disabled</if>">代付策略</a>
        </span>
        <span class="r">共有数据：<strong>{$count}</strong> 条</span>
    </div>

    <div class="mt-20">
        <table class="table table-border table-bordered table-bg table-hover table-sort">
            <thead>
                <tr class="text-c">
                    <th width="60">ID</th>
                    <th>策略名称</th>
                    <th width="100">类型</th>
                    <th width="80">档位数量</th>
                    <th width="100">商户数量</th>
                    <th width="80">状态</th>
                    <th width="150">创建时间</th>
                    <th width="200">操作</th>
                </tr>
            </thead>
            <tbody>
                <volist name="list" id="vo">
                    <tr class="text-c">
                        <td>{$vo.id}</td>
                        <td>{$vo.name}</td>
                        <td><span class="label label-primary">{$typeMap[$vo['type']]}</span></td>
                        <td>{$vo.tier_count}</td>
                        <td><span class="label label-success">{$vo.member_count}</span></td>
                        <td>
                            <if condition="$vo.status eq 1">
                                <span class="label label-success">启用</span>
                            <else/>
                                <span class="label label-default">禁用</span>
                            </if>
                        </td>
                        <td>{$vo.createtime|date='Y-m-d H:i',###}</td>
                        <td>
                            <a title="档位配置" href="{:U('tierList', array('strategyid' => $vo['id']))}" class="btn btn-primary size-MINI radius">档位配置</a>
                            <a title="编辑" href="javascript:;" onclick="strategy_edit('编辑策略', '{:U(\'edit\', array(\'id\' => $vo[\'id\']))}')" class="btn btn-secondary size-MINI radius">编辑</a>
                            <a title="删除" href="javascript:;" onclick="strategy_del(this, '{$vo.id}')" class="btn btn-danger size-MINI radius">删除</a>
                        </td>
                    </tr>
                </volist>
            </tbody>
        </table>
        <div class="page">{$page}</div>
    </div>
</div>

<script type="text/javascript">
/*策略-添加/编辑*/
function strategy_edit(title, url) {
    var index = layer.open({
        type: 2,
        title: title,
        content: url
    });
    layer.full(index);
}

/*策略-删除*/
function strategy_del(obj, id) {
    layer.confirm('确认要删除吗？', function(index) {
        $.ajax({
            type: 'POST',
            url: "{:U('del')}",
            data: {id: id},
            dataType: 'json',
            success: function(data) {
                if (data.status == 1) {
                    $(obj).parents("tr").remove();
                    layer.msg('已删除', {icon: 1, time: 1000});
                } else {
                    layer.msg(data.msg, {icon: 2, time: 2000});
                }
            }
        });
    });
}

$('.table-sort').DataTable({
    "paging": false,
    "lengthChange": false,
    "searching": false,
    "ordering": true,
    "info": false,
    "autoWidth": false
});
</script>
</body>
</html>
